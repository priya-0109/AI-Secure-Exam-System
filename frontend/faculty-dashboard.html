<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>

    <link rel="stylesheet" href="css/faculty.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Faculty Panel</h2>

        <ul>
            <li>Dashboard</li>
            <li onclick="goUpload()">Upload Paper</li>
            <li>Paper Status</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="header">
            <h1>Welcome Faculty</h1>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Papers</h3>
                <p id="totalPapers">0</p>
            </div>

            <div class="card">
                <h3>Encrypted Papers</h3>
                <p id="encryptedPapers">0</p>
            </div>

            <div class="card">
                <h3>Pending Approval</h3>
                <p id="pendingPapers">0</p>
            </div>

        </div>

        <div class="upload-section">
            <button onclick="goUpload()">Upload New Paper</button>
        </div>

        <div class="table-section">

            <h2>Recent Papers</h2>

            <table>

                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Title</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="paperTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="js/faculty.js"></script>

</body>
</html>
